version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: byte_user
      POSTGRES_PASSWORD: byte_pass
      POSTGRES_DB: byte_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byte_user -d byte_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    command: python -m bot.main
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build: .
    command: uvicorn admin.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
