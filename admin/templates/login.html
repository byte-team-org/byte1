<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Byte Admin — Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #212529; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { width: 380px; border-radius: 20px; border: none; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
    </style>
</head>
<body>
<div class="card login-card p-4">
    <h2 class="text-center mb-1 fw-bold">⚡ Byte Admin</h2>
    <p class="text-center text-muted mb-4">Панель управления</p>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
        <div class="mb-3">
            <label class="form-label fw-semibold">Логин</label>
            <input type="text" name="username" class="form-control form-control-lg" placeholder="admin" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Пароль</label>
            <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••" required>
        </div>
        <button type="submit" class="btn btn-dark btn-lg w-100">Войти</button>
    </form>
</div>
</body>
</html>
