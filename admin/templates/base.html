<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Byte Admin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #212529; }
        .sidebar .nav-link { color: rgba(255,255,255,.75); }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.1); border-radius: 8px; }
        .sidebar .brand { font-size: 1.4rem; font-weight: 700; color: #fff; }
        .stat-card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-3">
            <div class="brand mb-4">⚡ Byte Admin</div>
            <nav class="nav flex-column gap-1">
                <a class="nav-link {% if request.url.path == '/admin/dashboard' %}active{% endif %}" href="/admin/dashboard">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a class="nav-link {% if '/participants' in request.url.path %}active{% endif %}" href="/admin/participants">
                    <i class="bi bi-people me-2"></i>Участники
                </a>
                <a class="nav-link {% if '/volunteers' in request.url.path %}active{% endif %}" href="/admin/volunteers">
                    <i class="bi bi-person-check me-2"></i>Волонтёры
                </a>
                <hr style="border-color: rgba(255,255,255,.2)">
                <a class="nav-link text-danger" href="/admin/logout">
                    <i class="bi bi-box-arrow-right me-2"></i>Выйти
                </a>
            </nav>
        </div>
        <!-- Main -->
        <div class="col-md-10 p-4">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
